[package]
name = "phonelink-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true
description = "Vocabulary, codecs, configuration and OS edges of the Phone Link engine"

[lib]
doctest = false

[features]
# The fakes and builders other crates' tests use; this crate's own tests turn it on through the
# dev-dependency on itself below.
test-support = []

[dependencies]
async-trait.workspace = true
base64.workspace = true
flate2.workspace = true
hex.workspace = true
hmac.workspace = true
rand.workspace = true
regex.workspace = true
reqwest.workspace = true
rmpv.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
thiserror.workspace = true
tokio.workspace = true
tokio-util.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
uniffi.workspace = true
uuid.workspace = true

[dev-dependencies]
phonelink-core = { path = ".", features = ["test-support"] }
tempfile.workspace = true
tokio = { workspace = true, features = ["test-util"] }

[lints]
workspace = true
