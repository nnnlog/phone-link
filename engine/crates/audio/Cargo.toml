[package]
name = "phonelink-audio"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true
description = "The audio feature of the Phone Link engine"

[lib]
doctest = false

[features]
# The fakes and builders other crates' tests use; this crate's own tests turn it on through the
# dev-dependency on itself below.
test-support = ["phonelink-app/test-support", "phonelink-core/test-support", "phonelink-features/test-support", "phonelink-notifications/test-support"]

[dependencies]
phonelink-app.workspace = true
phonelink-core.workspace = true
phonelink-features.workspace = true
# Media sessions are read from the notification store.
phonelink-notifications.workspace = true
base64.workspace = true
rusqlite.workspace = true
thiserror.workspace = true
tokio.workspace = true
tokio-util.workspace = true
tracing.workspace = true

[dev-dependencies]
phonelink-audio = { path = ".", features = ["test-support"] }
serde_json.workspace = true
tempfile.workspace = true
tokio = { workspace = true, features = ["test-util"] }

[lints]
workspace = true
