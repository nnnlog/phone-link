syntax = "proto3";
package platform_sdk.v1;
import "platform_sdk/v1/trace_context.proto";

enum CSInitializeStatus {
  CS_INITIALIZE_STATUS_UNSPECIFIED = 0;
  CS_INITIALIZE_STATUS_SUCCESS = 1;
  CS_INITIALIZE_STATUS_ERROR = 2;
  CS_INITIALIZE_STATUS_ERROR_DEVICE_CONNECTION_FAILURE = 3;
}

message ContextSourceMessage {
  oneof type {
    platform_sdk.v1.CSInitializeMessage cs_initialize_message = 1;
    platform_sdk.v1.CSInitializeAckMessage cs_initialize_ack_message = 2;
    platform_sdk.v1.CSOpenDeviceConnectionRequest cs_open_device_connection_request = 3;
    platform_sdk.v1.CSConnectionInfo cs_connection_info = 8;
    platform_sdk.v1.CSErrorInfo cs_error_info = 9;
    platform_sdk.v1.CSWifiP2pInfo cs_wifi_p2p_info = 10;
    platform_sdk.v1.CSIdentityChallenge cs_identity_challenge = 11;
    platform_sdk.v1.CSIdentityResponse cs_identity_response = 12;
  }
}

message CSIdentityChallenge {
  bytes challenge = 1;
  string requester_dcg_client_id = 2;
  platform_sdk.v1.ProtoTraceContext trace_context = 3;
}

message CSIdentityResponse {
  bytes challenge = 1;
  string dcg_client_id = 2;
  platform_sdk.v1.ProtoTraceContext trace_context = 3;
}

message CSInitializeMessage {
  string context_source_id = 2;
  platform_sdk.v1.ProtoTraceContext trace_context = 4;
  int32 transport_preference = 5;
}

message CSInitializeAckMessage {
  platform_sdk.v1.CSInitializeStatus status = 3;
  platform_sdk.v1.ProtoTraceContext trace_context = 4;
}

message CSOpenDeviceConnectionRequest {
  string scenario_id = 1;
  platform_sdk.v1.ProtoTraceContext trace_context = 2;
}

message CSConnectionInfo {
  string connection_info = 1;
  platform_sdk.v1.ProtoTraceContext trace_context = 2;
}

message CSErrorInfo {
  string context_source_error_type = 1;
  platform_sdk.v1.ProtoTraceContext trace_context = 2;
}

message CSWifiP2pInfo {
  string p2p_info = 1;
  platform_sdk.v1.ProtoTraceContext trace_context = 2;
}

