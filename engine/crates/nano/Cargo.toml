[package]
name = "phonelink-nano"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true
description = "Nano peer-to-peer transport of the Phone Link engine"

[lib]
doctest = false

[features]
# The fakes and builders other crates' tests use; this crate's own tests turn it on through the
# dev-dependency on itself below.
test-support = ["phonelink-core/test-support", "phonelink-proto/test-support", "phonelink-transport/test-support"]

[dependencies]
phonelink-core.workspace = true
phonelink-proto.workspace = true
phonelink-transport.workspace = true
aes.workspace = true
aes-gcm.workspace = true
async-trait.workspace = true
base64.workspace = true
crc32fast.workspace = true
futures-util.workspace = true
hex.workspace = true
hmac.workspace = true
libc.workspace = true
md-5.workspace = true
prost.workspace = true
rand.workspace = true
regex.workspace = true
serde.workspace = true
serde_json.workspace = true
sha1.workspace = true
thiserror.workspace = true
tokio.workspace = true
tracing.workspace = true

[dev-dependencies]
phonelink-nano = { path = ".", features = ["test-support"] }
tokio = { workspace = true, features = ["test-util"] }

[lints]
workspace = true
