[package]
name = "phonelink-transport"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true
description = "Auth, DCG, relay and platform layers of the Phone Link engine"

[lib]
doctest = false

[features]
# The fakes and builders other crates' tests use; this crate's own tests turn it on through the
# dev-dependency on itself below.
test-support = ["phonelink-core/test-support", "phonelink-proto/test-support"]

[dependencies]
phonelink-core.workspace = true
phonelink-proto.workspace = true
aes.workspace = true
async-trait.workspace = true
base64.workspace = true
cbc.workspace = true
futures-util.workspace = true
hex.workspace = true
hmac.workspace = true
p384.workspace = true
prost.workspace = true
rand.workspace = true
reqwest.workspace = true
rmpv.workspace = true
roxmltree.workspace = true
rsa.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
thiserror.workspace = true
tokio.workspace = true
tokio-tungstenite.workspace = true
tokio-util.workspace = true
tracing.workspace = true
uuid.workspace = true
x509-cert.workspace = true

[dev-dependencies]
phonelink-transport = { path = ".", features = ["test-support"] }
tokio = { workspace = true, features = ["test-util"] }

[lints]
workspace = true
