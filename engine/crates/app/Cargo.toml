[package]
name = "phonelink-app"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true
description = "App message layer of the Phone Link engine"

[lib]
doctest = false

[features]
# The fakes and builders other crates' tests use; this crate's own tests turn it on through the
# dev-dependency on itself below.
test-support = ["phonelink-core/test-support", "phonelink-proto/test-support", "phonelink-transport/test-support"]

[dependencies]
phonelink-core.workspace = true
phonelink-proto.workspace = true
phonelink-transport.workspace = true
async-trait.workspace = true
form_urlencoded.workspace = true
futures-util.workspace = true
prost.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio.workspace = true
tokio-util.workspace = true
tracing.workspace = true
uuid.workspace = true

[dev-dependencies]
phonelink-app = { path = ".", features = ["test-support"] }
flate2.workspace = true
tokio = { workspace = true, features = ["test-util"] }

[lints]
workspace = true
