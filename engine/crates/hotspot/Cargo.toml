[package]
name = "phonelink-hotspot"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true
description = "The hotspot feature of the Phone Link engine"

[lib]
doctest = false

[features]
# The fakes and builders other crates' tests use; this crate's own tests turn it on through the
# dev-dependency on itself below.
test-support = ["phonelink-app/test-support", "phonelink-bluetooth/test-support", "phonelink-core/test-support", "phonelink-features/test-support", "phonelink-proto/test-support", "phonelink-transport/test-support"]

[dependencies]
phonelink-app.workspace = true
# Instant hotspot pairs through Bluetooth.
phonelink-bluetooth.workspace = true
phonelink-core.workspace = true
phonelink-features.workspace = true
phonelink-proto.workspace = true
phonelink-transport.workspace = true
async-trait.workspace = true
base64.workspace = true
prost.workspace = true
rand.workspace = true
rand_core06.workspace = true
rsa.workspace = true
serde_json.workspace = true
sha2_010.workspace = true
thiserror.workspace = true
tokio.workspace = true
tracing.workspace = true
uniffi.workspace = true

[dev-dependencies]
phonelink-hotspot = { path = ".", features = ["test-support"] }
tokio = { workspace = true, features = ["test-util"] }

[lints]
workspace = true
