[package]
name = "phonelink-screen-mirroring"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true
description = "The screen_mirroring feature of the Phone Link engine"

[lib]
doctest = false

[features]
# The fakes and builders other crates' tests use; this crate's own tests turn it on through the
# dev-dependency on itself below.
test-support = ["phonelink-app/test-support", "phonelink-core/test-support", "phonelink-features/test-support", "phonelink-nano/test-support", "phonelink-notifications/test-support"]

[dependencies]
phonelink-app.workspace = true
phonelink-core.workspace = true
phonelink-features.workspace = true
phonelink-nano.workspace = true
# Screen mirroring opens a notification's action on the phone.
phonelink-notifications.workspace = true
async-trait.workspace = true
futures-util.workspace = true
rand.workspace = true
rusqlite.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio.workspace = true
tokio-util.workspace = true
tracing.workspace = true
uniffi.workspace = true

[dev-dependencies]
phonelink-screen-mirroring = { path = ".", features = ["test-support"] }
tokio = { workspace = true, features = ["test-util"] }

[lints]
workspace = true
