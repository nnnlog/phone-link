[package]
name = "phonelink-phone-apps"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true
description = "The phone_apps feature of the Phone Link engine"

[lib]
doctest = false

[features]
# The fakes and builders other crates' tests use; this crate's own tests turn it on through the
# dev-dependency on itself below.
test-support = ["phonelink-app/test-support", "phonelink-core/test-support", "phonelink-features/test-support"]

[dependencies]
phonelink-app.workspace = true
phonelink-core.workspace = true
phonelink-features.workspace = true
async-trait.workspace = true
rusqlite.workspace = true
thiserror.workspace = true
tokio.workspace = true
tokio-util.workspace = true
tracing.workspace = true
uniffi.workspace = true

[dev-dependencies]
phonelink-phone-apps = { path = ".", features = ["test-support"] }
tokio = { workspace = true, features = ["test-util"] }

[lints]
workspace = true
